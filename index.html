let AC=null,NB=null,voices=0;const lastS={};

function tone(f0,f1,dur,type,vol,dl){const t=AC.currentTime+(dl||0),o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);voices++;o.onended=()=>voices--}
function noise(dur,vol,f0,f1,hp){const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=NB;f.type=hp?'highpass':'lowpass';f.frequency.setValueAtTime(f0,t);f.frequency.exponentialRampToValueAtTime(Math.max(30,f1),t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,rnd()*.5);s.stop(t+dur+.02);voices++;s.onended=()=>voices--}
const SMIN={shoot:.05,rifle:.04,shot:.08,flame:.1,boom:.08,hit:.05,die:.05,gem:.04,coin:.05,lvl:.2,hurt:.15,click:.03,over:1,boss:1,scream:.5,spit:.15,swing:.1,saw:.12,turret:.08};
function sfx(n){if(!SV.set.snd||!AC||voices>12)return;const now=AC.currentTime;if(lastS[n]&&now-lastS[n]<(SMIN[n]||.05))return;lastS[n]=now;
switch(n){
case'shoot':tone(760,220,.07,'square',.06);break;
case'rifle':tone(520,110,.06,'sawtooth',.05);noise(.04,.05,3000,800,1);break;
case'shot':noise(.18,.15,2600,300);tone(140,50,.12,'square',.08);break;
case'flame':noise(.1,.04,1500,600,1);break;
case'boom':noise(.5,.28,1800,60);tone(110,28,.4,'sine',.25);break;
case'hit':tone(240,130,.04,'square',.025);break;
case'die':tone(170,45,.13,'sawtooth',.05);break;
case'gem':tone(900,1400,.05,'triangle',.05);break;
case'coin':tone(1250,1850,.07,'square',.04);break;
case'lvl':[523,659,784,1047].forEach((f,i)=>tone(f,f*1.01,.12,'square',.06,i*.08));break;
case'hurt':tone(210,70,.18,'square',.1);noise(.08,.06,900,200);break;
case'click':tone(620,520,.04,'square',.04);break;
case'over':[392,330,262,196].forEach((f,i)=>tone(f,f*.97,.3,'sawtooth',.07,i*.2));break;
case'boss':tone(80,38,.9,'sawtooth',.14);noise(.7,.1,500,80);break;
case'scream':tone(900,420,.45,'sawtooth',.05);tone(950,450,.45,'square',.03);break;
case'spit':tone(300,700,.1,'sine',.06);break;
case'swing':noise(.12,.08,1800,500,1);break;
case'saw':tone(110,95,.04,'square',.02);break;
case'turret':tone(900,500,.04,'square',.03);break;
}}

function rSettings(){const s=SV.set;const row=(n,d,k,v)=>`<div class="item"><div class="tx">${n}<small>${d}</small></div><button class="btn sm" data-a="set" data-k="${k}">${v}</button></div>`;

<div class="item"><div class="tx">RESET PROGRESS<small>Erases coins, unlocks, records</small></div><button class="btn sm ${rstArm?'play':'gry'}" data-a="reset">${rstArm?'TAP AGAIN':'RESET'}</button></div></div></div></div>`)}
function renderPause(){$('pause').innerHTML=`<div class="panel mid"><h1>PAUSED</h1><button class="btn big grn" data-a="resume">RESUME</button><div class="brow"><button class="btn" data-a="set" data-k="snd">SOUND: ${SV.set.snd?'ON':'OFF'}</button><button class="btn gry" data-a="quit">QUIT</button></div></div>`}
function cardHtml(c,i){let h='';if(c.k==='w'){const d=WDEF[c.id];if(c.up){const w=G.weapons.find(x=>x.id===c.id),n=w.lv+1,ev=n===5,m=d.ups[n-2];h=`<div class="card ${ev?'evo':''}" data-a="pick" data-i="${i}"><canvas data-ic="w,${c.id},5"></canvas><b>${wName(c.id,n)}</b><small class="nw">${ev?'EVOLUTION!':'LV '+w.lv+' > '+n}</small><small>${modText(m,d.t)}</small></div>`}
else h=`<div class="card" data-a="pick" data-i="${i}"><canvas data-ic="w,${c.id},5"></canvas><b>${d.n}</b><small class="nw">NEW WEAPON</small><small>${d.d}</small></div>`}
else if(c.k==='p'){const p=PASS.find(x=>x.id===c.id),l=G.pass[c.id]||0;h=`<div class="card" data-a="pick" data-i="${i}"><canvas data-ic="p,${c.id},5"></canvas><b>${p.n}</b><small class="nw">${l?'LV '+l+' > '+(l+1):'NEW PASSIVE'}</small><small>${p.d}</small></div>`}
else h=`<div class="card" data-a="pick" data-i="${i}"><canvas data-ic="p,${c.id==='heal'?'heal':'coin'},5"></canvas><b>${c.id==='heal'?'FIRST AID':'COIN BAG'}</b><small>${c.id==='heal'?'Heal 40% health':'+40 coins'}</small></div>`;return h}
function renderLevelUp(){G.chs=buildChoices();const el=$('lvl');el.innerHTML=`<div class="mid"><h1>LEVEL UP!</h1><div class="cards">${G.chs.map(cardHtml).join('')}</div></div>`;icons(el);const cs=el.querySelectorAll('.card');cs.forEach(c=>c.classList.add('dis'));setTimeout(()=>cs.forEach(c=>c.classList.remove('dis')),450)}
function showOver(){if(!G||G.st!=='over')return;const r=G.res;$('pbtn').style.display='none';$('over').innerHTML=`<div class="panel mid"><h1 class="r">GAME OVER</h1><div class="stats"><span>SURVIVED</span><span>${fmtT(G.t)} ${r.nb?'<b style="color:#ffd24a">NEW BEST!</b>':''}</span><span>KILLS</span><span>${G.kills} ${r.nk?'<b style="color:#ffd24a">NEW BEST!</b>':''}</span><span>LEVEL</span><span>${G.lvMax}</span><span>BOSSES</span><span>${G.bossK}</span><span>COINS EARNED</span><span style="color:#ffd24a">+${r.earned}</span></div><div class="brow"><button class="btn big play" data-a="retry">RETRY</button><button class="btn big gry" data-a="quit">MENU</button></div></div>`;show('over')}
function act(a,d,el){switch(a){
case'play':case'survivors':openSub('select');break;
case'weapons':case'shop':case'missions':case'board':case'settings':openSub(a);break;
case'back':lastSub='';hide('sub');show('menu');renderMenu();rstArm=0;break;
case'start':startGame();break;
case'char':{const c=CH.find(x=>x.id===d.id);if(SV.chars.includes(c.id))SV.selC=c.id;else if(SV.coins>=c.cost){SV.coins-=c.cost;SV.chars.push(c.id);SV.selC=c.id;sfx('lvl')}else{toast('NOT ENOUGH COINS');break}save();renderSub();break}
case'map':{const c=MAPS.find(x=>x.id===d.id);if(SV.maps.includes(c.id))SV.selM=c.id;else if(SV.coins>=c.cost){SV.coins-=c.cost;SV.maps.push(c.id);SV.selM=c.id;sfx('lvl')}else{toast('NOT ENOUGH COINS');break}save();renderSub();break}
case'buy':{const s=SHOP.find(x=>x.k===d.k),l=SV.shop[s.k];if(l>=s.max)break;const c=shopCost(s,l);if(SV.coins<c){toast('NOT ENOUGH COINS');break}SV.coins-=c;SV.shop[s.k]++;save();sfx('coin');renderSub();break}
case'claim':{const m=MISSIONS.find(x=>x.id===d.id);if(SV.claimed[m.id]||m.p(SV.st)<m.g){break}SV.claimed[m.id]=1;SV.coins+=m.r;save();sfx('lvl');renderSub();break}
case'set':{const s=SV.set,k=d.k;if(k==='ctl')s.ctl=(s.ctl+1)%3;else if(k==='gfx'){s.gfx=(s.gfx+1)%3;resize()}else s[k]=s[k]?0:1;save();if(k==='snd'&&s.snd)aInit();if(G&&G.st==='pause')renderPause();else renderSub();break}
case'reset':if(!rstArm){rstArm=1;renderSub();setTimeout(()=>{rstArm=0;if(SUB==='settings'&&$('sub').classList.contains('on'))renderSub()},3000)}else{rstArm=0;try{localStorage.removeItem(SKEY)}catch(e){}load();save();toast('PROGRESS RESET');renderSub()}break;
case'resume':resumeGame();break;
case'quit':quitToMenu();break;
case'retry':startGame();break;
case'pick':{if(G.st!=='lvl')break;applyChoice(G.chs[+d.i]);G.lvPend--;hide('lvl');G.st='play';if(G.lvPend>0)openLevelUp();break}}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.classList.contains('dis'))return;aInit();if(el.dataset.a!=='pick')sfx('click');act(el.dataset.a,el.dataset,el)});

/* ---------- main loop, input ---------- */
let last=performance.now(),fpsAcc=0,fpsN=0,fpsShow='',upMs=0,rdMs=0,perfN=0,perfMax=0,frameCt=0,menuT=0;const perfLog={frames:0,upS:0,rdS:0,max:0,dts:[]};
function loop(now){requestAnimationFrame(loop);let dt=(now-last)/1000;last=now;if(dt>.1)dt=.1;frameCt++;
fpsAcc+=dt;fpsN++;if(fpsAcc>=.5){fpsShow=(fpsN/fpsAcc).toFixed(0);fpsAcc=0;fpsN=0;if(DEBUG)$('fps').textContent='FPS '+fpsShow+'  up '+(perfLog.upS/Math.max(1,perfLog.frames)).toFixed(2)+'ms rd '+(perfLog.rdS/Math.max(1,perfLog.frames)).toFixed(2)+'ms z'+zAlive}
if(innerHeight>innerWidth*1.02&&APP==='game'&&G&&G.st==='play')pauseGame();
const t0=performance.now();
if(APP==='game'&&G){if(G.st==='play')update(Math.min(dt,.05));const t1=performance.now();drawWorld(dt);const t2=performance.now();if(DEBUG){perfLog.frames++;perfLog.upS+=t1-t0;perfLog.rdS+=t2-t1;perfLog.dts.push(dt*1000);if(t2-t0>perfLog.max)perfLog.max=t2-t0}}
else{menuT+=dt;drawMenuBg(menuT)}}
function startGame(){aInit();if(SV.set.fs){try{const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen({navigationUI:'hide'}).then(()=>{try{screen.orientation.lock('landscape').catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}}
APP='game';startRun();hideAll();$('pbtn').style.display='block';joy.on=0;joy.x=joy.y=0;resize()}
function quitToMenu(){APP='menu';G=null;$('pbtn').style.display='none';hideAll();show('menu');renderMenu()}
function pauseGame(){if(!G||G.st!=='play')return;G.st='pause';joy.on=0;joy.x=joy.y=0;renderPause();show('pause')}
function resumeGame(){if(!G||G.st!=='pause')return;G.st='play';hide('pause')}
function openLevelUp(){if(G.st!=='play')return;G.st='lvl';joy.on=0;joy.x=joy.y=0;sfx('lvl');renderLevelUp();show('lvl')}
/* input */
addEventListener('keydown',e=>{const k=e.key.toLowerCase();keys[k]=1;if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();if((k==='escape'||k==='p')&&G&&APP==='game'){G.st==='play'?pauseGame():G.st==='pause'&&resumeGame()}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=0});addEventListener('blur',()=>{for(const k in keys)keys[k]=0;pauseGame()});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame()});
function jsetup(e){joy.on=1;joy.id=e.pointerId;joy.ox=joy.kx=e.clientX;joy.oy=joy.ky=e.clientY;joy.x=joy.y=0}
cv.addEventListener('pointerdown',e=>{if(APP!=='game'||!G||G.st!=='play'||joy.on)return;e.preventDefault();aInit();try{cv.setPointerCapture(e.pointerId)}catch(_){}jsetup(e)});
cv.addEventListener('pointermove',e=>{if(!joy.on||e.pointerId!==joy.id)return;const R=50*[.8,1,1.3][SV.set.ctl];let dx=e.clientX-joy.ox,dy=e.clientY-joy.oy;const d=Math.hypot(dx,dy);
if(d>R){const f=(d-R)/d;joy.ox+=dx*f;joy.oy+=dy*f;dx=e.clientX-joy.ox;dy=e.clientY-joy.oy}
joy.kx=joy.ox+dx;joy.ky=joy.oy+dy;const m=Math.min(1,Math.hypot(dx,dy)/R);if(m<.12){joy.x=joy.y=0}else{const l=Math.hypot(dx,dy)||1;joy.x=dx/l*m;joy.y=dy/l*m}});
const jend=e=>{if(e.pointerId===joy.id){joy.on=0;joy.x=joy.y=0}};cv.addEventListener('pointerup',jend);cv.addEventListener('pointercancel',jend);cv.addEventListener('lostpointercapture',jend);
document.addEventListener('contextmenu',e=>e.preventDefault());
$('pbtn').addEventListener('click',()=>{aInit();sfx('click');pauseGame()});
addEventListener('resize',resize);addEventListener('orientationchange',()=>setTimeout(resize,200));

 fast:(secs,bot)=>{const n=secs*60|0;for(let i=0;i<n&&G&&G.st==='play';i++){if(bot){const a=i/60*.8;keys.a=Math.cos(a)<-.3;keys.d=Math.cos(a)>.3;keys.w=Math.sin(a)<-.3;keys.s=Math.sin(a)>.3}update(1/60);if(G.st==='lvl'){const cs=buildChoices();applyChoice(cs[0]);G.lvPend--;G.st='play';hide('lvl')}}for(const k of['a','d','w','s'])keys[k]=0},
 zAlive:()=>zAlive,fill:n=>{for(let i=0;i<n&&zAlive<zCap;i++){const p=ringPos(rr(120,300));spawnZ(i%7===0?3:i%5===0?6:pickType(),p[0],p[1])}},pickLv:()=>{const cs=$('lvl').querySelectorAll('.card');if(cs.length)cs[ri(0,cs.length-1)].click()}}}
